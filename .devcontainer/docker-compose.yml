services:
  bastion:
    image: ubuntu:24.04
    command: bash -lc "sleep infinity"
    volumes:
      - ..:/workspace:cached

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: meetlab
      POSTGRES_PASSWORD: meetlab
      POSTGRES_DB: meetlab
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U meetlab -d meetlab"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    command: redis-server --bind 0.0.0.0 --protected-mode no
    ports:
      - "6379:6379"

  transport-server:
    image: livekit/livekit-server:v1.12.0
    command: ["--dev", "--bind", "0.0.0.0", "--config", "/config/livekit.yaml"]
    ports:
      - "7880:7880/tcp"
      - "7881:7881/tcp"
      - "7882:7882/udp"
    volumes:
      - ./livekit.yaml:/config/livekit.yaml:ro
    depends_on:
      - redis

  egress:
    image: livekit/egress:v1.13.0
    cap_add:
      - SYS_ADMIN
    environment:
      EGRESS_CONFIG_BODY: |
        log_level: debug
        api_key: devkey
        api_secret: secret
        ws_url: ws://transport-server:7880
        insecure: true
        redis:
          address: redis:6379
    volumes:
      - ../recordings:/recordings
    depends_on:
      - transport-server
      - redis

  jaeger:
    image: jaegertracing/all-in-one:1.65.0
    ports:
      - "16686:16686"
    environment:
      - COLLECTOR_OTLP_ENABLED=true

  agent-runner:
    build:
      context: ../agent-runner
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - ../agent-runner/.env.runner
    environment:
      - DATABASE_URL=postgresql+asyncpg://meetlab:meetlab@postgres:5432/meetlab
      - BOT_RUNNER_SECRET=${BOT_RUNNER_SECRET:-}
    volumes:
      - ../agent-runner:/app:cached
      - agent-runner-venv:/app/.venv
      - ../recordings:/recordings
    ports:
      - "7860:7860"
    depends_on:
      postgres:
        condition: service_healthy
      transport-server:
        condition: service_started
      jaeger:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:7860/health')\""]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 10s

  meet:
    build:
      context: ../meet
      dockerfile: Dockerfile
      target: dev
    env_file:
      - ../meet/.env.local
    environment:
      - BOT_RUNNER_URL=http://agent-runner:7860/
      - BOT_RUNNER_SECRET=${BOT_RUNNER_SECRET:-}
    volumes:
      - ../meet:/app:cached
      - meet-node-modules:/app/node_modules
    ports:
      - "3000:3000"
    depends_on:
      transport-server:
        condition: service_started
      agent-runner:
        condition: service_healthy

volumes:
  agent-runner-venv:
  meet-node-modules:
  postgres-data:
