services:
  bastion:
    image: ubuntu:24.04
    command: bash -lc "sleep infinity"
    volumes:
      - ..:/workspace:cached

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: meetlab
      POSTGRES_PASSWORD: meetlab
      POSTGRES_DB: meetlab
    ports:
      # host 5433 to avoid clashing with other local postgres containers;
      # in-cluster connections still use postgres:5432
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U meetlab -d meetlab"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    command: redis-server --bind 0.0.0.0 --protected-mode no
    ports:
      - "6379:6379"

  transport-server:
    image: livekit/livekit-server:v1.12.0
    command: ["--dev", "--bind", "0.0.0.0", "--config", "/config/livekit.yaml"]
    ports:
      - "7880:7880/tcp"
      - "7881:7881/tcp"
      - "7882:7882/udp"
    volumes:
      - ./livekit.yaml:/config/livekit.yaml:ro
    depends_on:
      - redis

  egress:
    image: livekit/egress:v1.13.0
    cap_add:
      - SYS_ADMIN
    environment:
      EGRESS_CONFIG_BODY: |
        log_level: debug
        api_key: devkey
        api_secret: secret
        ws_url: ws://transport-server:7880
        insecure: true
        redis:
          address: redis:6379
    volumes:
      - ../recordings:/recordings
    depends_on:
      - transport-server
      - redis

  jaeger:
    image: jaegertracing/all-in-one:1.65.0
    ports:
      - "16686:16686"
    environment:
      - COLLECTOR_OTLP_ENABLED=true

  # Production's speech-to-text (stt-cpu/, the same image CI builds): Parakeet int8 on CPU.
  stt-cpu:
    build:
      context: ../stt-cpu
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,json,sys; sys.exit(0 if json.load(urllib.request.urlopen('http://localhost:8000/health'))['ready'] else 1)"]
      interval: 10s
      timeout: 3s
      retries: 30

  # agent-runner's only way to Docker: container create, start, stop and inspect.
  # No images, exec, volumes, networks or system calls. The raw socket is read-only
  # and never mounted into agent-runner itself. Create is still powerful (a container
  # can mount host paths), which is acceptable on a laptop and never used beyond it.
  docker-socket-proxy:
    image: tecnativa/docker-socket-proxy:latest
    restart: unless-stopped
    environment:
      - CONTAINERS=1
      - POST=1
      - ALLOW_START=1
      - ALLOW_STOP=1
      - ALLOW_RESTARTS=0
      - EXEC=0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro

  agent-runner:
    build:
      context: ../agent-runner
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - ../agent-runner/.env.runner
    environment:
      - DATABASE_URL=postgresql+asyncpg://meetlab:meetlab@postgres:5432/meetlab
      - BOT_RUNNER_SECRET=${BOT_RUNNER_SECRET:-}
      # Speech-to-text as production runs it: Parakeet on our CPU server (stt-cpu below,
      # infra/v2/stack/stt_cpu.tf), so dev catches what prod would hit.
      - STT_MODEL_OVERRIDE=${STT_MODEL_OVERRIDE-parakeet-tdt-0.6b-v2}
      - NEMOTRON_STT_URL=${NEMOTRON_STT_URL:-http://stt-cpu:8000}
      # Bot JWT lifetime (min). Default 15; soak/longevity runs raise it so 20-min+
      # sessions don't drop on token expiry. `make soak` passes 30 here.
      - BOT_TOKEN_TTL_MINUTES=${BOT_TOKEN_TTL_MINUTES:-15}
      # Zero-cost mock TTS for load/soak testing (no paid TTS calls). OFF by default —
      # `make soak MOCK=1` turns it on. Never enable in production.
      - BOT_MOCK_TTS=${BOT_MOCK_TTS:-0}
      # Each meeting's bot runs as its own container, as each is its own ECS task in
      # staging (dispatch.py). There is no in-process mode: /start refuses without one.
      - BOT_DISPATCHER=${BOT_DISPATCHER:-docker}
      - DOCKER_HOST=tcp://docker-socket-proxy:2375
    volumes:
      - ../agent-runner:/app:cached
      - agent-runner-venv:/app/.venv
      - ../recordings:/recordings
    ports:
      - "7860:7860"
    depends_on:
      stt-cpu:
        condition: service_healthy
      postgres:
        condition: service_healthy
      transport-server:
        condition: service_started
      jaeger:
        condition: service_started
      docker-socket-proxy:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:7860/health')\""]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 10s

  meet:
    build:
      context: ../meet
      dockerfile: Dockerfile
      target: dev
    env_file:
      - ../meet/.env.local
    environment:
      - BOT_RUNNER_URL=http://agent-runner:7860/
      - BOT_RUNNER_SECRET=${BOT_RUNNER_SECRET:-}
    volumes:
      - ../meet:/app:cached
      - meet-node-modules:/app/node_modules
    ports:
      - "3000:3000"
    depends_on:
      transport-server:
        condition: service_started
      agent-runner:
        condition: service_healthy

volumes:
  agent-runner-venv:
  meet-node-modules:
  postgres-data:
