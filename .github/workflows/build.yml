# The pipeline before production (main is v2's code; v1 is the tag v1.0.0) (one production, no staging, since 2026-10-14):
#
#   PR into main -> offline tests + a read-only plan of production, posted on the PR;
#                  images built but not pushed
#   merge to main -> the tests, then images pushed, tagged with the commit SHA (the images-only
#                  role). Nothing is deployed: a release tag deploys a green build's images
#                  to production after the reviewer's approval (release.yml).
#
# infra/bootstrap is deliberately absent: it defines these roles and is applied by a person,
# so CI can never widen its own permissions.
#
# No nightly drift check: scheduled workflows run only from the default branch (main, frozen).
# Every PR plan doubles as a drift check of production.

name: Build

on:
  pull_request:
    branches: [main]
    paths: ["infra/**", ".github/workflows/**", "Makefile", "meet/**", "agent-runner/**", "!**/*.md"]
  push:
    branches: [main]
    paths: ["infra/**", ".github/workflows/build.yml", "meet/**", "agent-runner/**", "!**/*.md"]

permissions:
  contents: read

# A deploy has its own group: GitHub keeps one pending run per group, so sharing one
# with PR plans let a PR push silently cancel a queued deploy (2026-10-03, #138).
# A PR's newer push supersedes its own plan. A PR's plan only reads the state, so it takes no
# lock (-lock=false): its lock once failed a deploy's drift check (2026-10-04).
concurrency:
  group: ${{ github.event_name == 'push' && 'meetlab-images' || format('meetlab-plan-{0}', github.ref) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  AWS_REGION: us-east-1
  TF_IN_AUTOMATION: "1"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with: { terraform_version: "1.15.1" }
      - run: make test-infra
      - run: make test-config-parity
      - uses: astral-sh/setup-uv@v6
      - run: make test-stt-cpu
      - run: make test-static # dead code, image budget, docs, meet lint/tsc/knip, workflows, scripts (docs/testing.md)

  plan:
    if: github.event_name == 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with: { terraform_version: "1.15.1", terraform_wrapper: false }
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.TF_PLAN_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Plan
        working-directory: infra/stack
        run: |
          set -euo pipefail
          terraform init -input=false -backend-config=key=v2/prod/terraform.tfstate
          terraform plan -input=false -no-color -lock=false -out=tfplan \
            -var=env=prod -var=hostname_suffix= -var="image_tag=${{ github.event.pull_request.head.sha }}"
          terraform show -no-color tfplan > plan.txt
      - name: Post plan on the PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          {
            echo "### Terraform plan — infra/stack, production"
            echo
            grep -E '^(Plan:|No changes)' infra/stack/plan.txt || true
            echo
            echo '<details><summary>Full plan</summary>'
            echo
            echo '```'
            head -c 60000 infra/stack/plan.txt
            echo '```'
            echo '</details>'
          } > comment.md
          gh pr comment "${{ github.event.pull_request.number }}" --body-file comment.md

  # PRs: prove both images still build. No credentials.
  build:
    if: github.event_name == 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { name: meet, context: meet, target: runner }
          - { name: agent-runner, context: agent-runner, target: "" }
          - { name: stt-cpu, context: stt-cpu, target: "" }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          target: ${{ matrix.target }}
          platforms: linux/amd64
          push: false
          cache-from: type=gha,scope=${{ matrix.name }}

  # Merges: push images tagged with the commit SHA; a release deploys them (release.yml).
  images:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    strategy:
      matrix:
        include:
          - { name: meet, context: meet, target: runner }
          - { name: agent-runner, context: agent-runner, target: "" }
          - { name: stt-cpu, context: stt-cpu, target: "" }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.IMAGES_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2
      - name: Skip if this SHA is already pushed
        id: exists
        run: |
          if aws ecr describe-images --repository-name "meetlab-v2/${{ matrix.name }}" \
               --image-ids imageTag=${{ github.sha }} >/dev/null 2>&1; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: docker/build-push-action@v6
        if: steps.exists.outputs.skip != 'true'
        with:
          context: ${{ matrix.context }}
          target: ${{ matrix.target }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.ecr.outputs.registry }}/meetlab-v2/${{ matrix.name }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
