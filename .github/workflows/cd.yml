name: CD

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed

permissions:
  contents: read

jobs:
  deploy_meet:
    name: Deploy Meet to Elastic Beanstalk
    if: |
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: eb-production-meet-deploy
      cancel-in-progress: false
    permissions:
      id-token: write
      contents: read

    env:
      AWS_REGION: us-east-1
      HEALTH_PATH: ${{ vars.MEET_HEALTH_PATH || '/' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 1

      - name: Show runner disk usage before deploy
        run: |
          set -euo pipefail
          df -h
          du -sh .

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/${{ secrets.AWS_ROLE_NAME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Build deployment package
        run: |
          set -euo pipefail
          bash scripts/build-meet-eb-deploy-package.sh deploy-meet-eb.zip
          ls -lh deploy-meet-eb.zip
          unzip -l deploy-meet-eb.zip | sed -n '1,120p'

      - name: Deploy to Elastic Beanstalk
        id: eb_deploy
        uses: aws-actions/aws-elasticbeanstalk-deploy@v1.0.0
        with:
          aws-region: ${{ env.AWS_REGION }}
          application-name: ${{ secrets.AWS_APPLICATION_NAME }}
          environment-name: ${{ secrets.AWS_PROD_MEET_ENVIRONMENT_NAME }}
          version-label: meet-${{ github.event.workflow_run.head_sha }}
          deployment-package-path: deploy-meet-eb.zip
          wait-for-deployment: true
          wait-for-environment-recovery: true
          create-application-if-not-exists: false
          create-environment-if-not-exists: false

      - name: Assert EB deployment state
        env:
          DEPLOYED_VERSION: ${{ steps.eb_deploy.outputs['version-label'] }}
          DEPLOYED_STATUS: ${{ steps.eb_deploy.outputs['environment-status'] }}
          DEPLOYED_HEALTH: ${{ steps.eb_deploy.outputs['environment-health'] }}
          TARGET_VERSION: meet-${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          echo "Deployed version=${DEPLOYED_VERSION}, status=${DEPLOYED_STATUS}, health=${DEPLOYED_HEALTH}"
          test "${DEPLOYED_VERSION}" = "${TARGET_VERSION}"
          test "${DEPLOYED_STATUS}" = "Ready"
          test "${DEPLOYED_HEALTH}" = "Green"

      - name: Smoke test deployed app
        env:
          ENV_URL: ${{ steps.eb_deploy.outputs['environment-url'] }}
        run: |
          set -euo pipefail

          if [ -z "${ENV_URL}" ] || [ "${ENV_URL}" = "None" ]; then
            echo "No environment URL returned by deploy action."
            exit 1
          fi

          if [[ "${HEALTH_PATH}" != /* ]]; then
            HEALTH_PATH="/${HEALTH_PATH}"
          fi

          if [[ "${ENV_URL}" == http://* || "${ENV_URL}" == https://* ]]; then
            URLS=("${ENV_URL%/}${HEALTH_PATH}")
          else
            URLS=("https://${ENV_URL%/}${HEALTH_PATH}" "http://${ENV_URL%/}${HEALTH_PATH}")
          fi

          for url in "${URLS[@]}"; do
            echo "Probing ${url}"
            if curl --fail --show-error --silent --max-time 15 \
              --retry 8 --retry-delay 5 --retry-all-errors "${url}" > /dev/null; then
              exit 0
            fi
          done

          echo "Deployed app smoke test did not return 2xx."
          exit 1

  deploy_agent_runner:
    name: Deploy Agent Runner to Elastic Beanstalk
    if: |
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: eb-production-agent-runner-deploy
      cancel-in-progress: false
    permissions:
      id-token: write
      contents: read

    env:
      AWS_REGION: us-east-1
      HEALTH_PATH: ${{ vars.AGENT_RUNNER_HEALTH_PATH || '/health' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 1

      - name: Show runner disk usage before deploy
        run: |
          set -euo pipefail
          df -h
          du -sh .

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/${{ secrets.AWS_ROLE_NAME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Build deployment package
        run: |
          set -euo pipefail
          bash scripts/build-agent-runner-eb-deploy-package.sh deploy-agent-runner-eb.zip
          ls -lh deploy-agent-runner-eb.zip
          unzip -l deploy-agent-runner-eb.zip | sed -n '1,120p'

      - name: Deploy to Elastic Beanstalk
        id: eb_deploy
        uses: aws-actions/aws-elasticbeanstalk-deploy@v1.0.0
        with:
          aws-region: ${{ env.AWS_REGION }}
          application-name: ${{ secrets.AWS_APPLICATION_NAME }}
          environment-name: ${{ secrets.AWS_PROD_AGENT_RUNNER_ENVIRONMENT_NAME }}
          version-label: agent-runner-${{ github.event.workflow_run.head_sha }}
          deployment-package-path: deploy-agent-runner-eb.zip
          wait-for-deployment: true
          wait-for-environment-recovery: true
          create-application-if-not-exists: false
          create-environment-if-not-exists: false

      - name: Assert EB deployment state
        env:
          DEPLOYED_VERSION: ${{ steps.eb_deploy.outputs['version-label'] }}
          DEPLOYED_STATUS: ${{ steps.eb_deploy.outputs['environment-status'] }}
          DEPLOYED_HEALTH: ${{ steps.eb_deploy.outputs['environment-health'] }}
          TARGET_VERSION: agent-runner-${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          echo "Deployed version=${DEPLOYED_VERSION}, status=${DEPLOYED_STATUS}, health=${DEPLOYED_HEALTH}"
          test "${DEPLOYED_VERSION}" = "${TARGET_VERSION}"
          test "${DEPLOYED_STATUS}" = "Ready"
          test "${DEPLOYED_HEALTH}" = "Green"

      - name: Smoke test deployed app
        env:
          ENV_URL: ${{ steps.eb_deploy.outputs['environment-url'] }}
        run: |
          set -euo pipefail

          if [ -z "${ENV_URL}" ] || [ "${ENV_URL}" = "None" ]; then
            echo "No environment URL returned by deploy action."
            exit 1
          fi

          if [[ "${HEALTH_PATH}" != /* ]]; then
            HEALTH_PATH="/${HEALTH_PATH}"
          fi

          if [[ "${ENV_URL}" == http://* || "${ENV_URL}" == https://* ]]; then
            URLS=("${ENV_URL%/}${HEALTH_PATH}")
          else
            URLS=("https://${ENV_URL%/}${HEALTH_PATH}" "http://${ENV_URL%/}${HEALTH_PATH}")
          fi

          for url in "${URLS[@]}"; do
            echo "Probing ${url}"
            if curl --fail --show-error --silent --max-time 15 \
              --retry 8 --retry-delay 5 --retry-all-errors "${url}" > /dev/null; then
              exit 0
            fi
          done

          echo "Deployed app smoke test did not return 2xx."
          exit 1
