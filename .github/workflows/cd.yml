name: CD

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed

permissions:
  contents: read

jobs:
  deploy_meet:
    name: Deploy Meet to Elastic Beanstalk
    if: |
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: eb-production-meet-deploy
      cancel-in-progress: false
    permissions:
      id-token: write
      contents: read

    env:
      AWS_REGION: us-east-1
      HEALTH_PATH: ${{ vars.MEET_HEALTH_PATH || '/' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 1

      - name: Show runner disk usage before deploy
        run: |
          set -euo pipefail
          df -h
          du -sh .

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/${{ secrets.AWS_ROLE_NAME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Build deployment package
        run: |
          set -euo pipefail
          bash scripts/build-meet-eb-deploy-package.sh deploy-meet-eb.zip
          ls -lh deploy-meet-eb.zip
          unzip -l deploy-meet-eb.zip | sed -n '1,120p'

      - name: Deploy to Elastic Beanstalk
        id: eb_deploy
        uses: aws-actions/aws-elasticbeanstalk-deploy@v1.0.0
        with:
          aws-region: ${{ env.AWS_REGION }}
          application-name: ${{ secrets.AWS_APPLICATION_NAME }}
          environment-name: ${{ secrets.AWS_PROD_MEET_ENVIRONMENT_NAME }}
          version-label: meet-${{ github.event.workflow_run.head_sha }}
          deployment-package-path: deploy-meet-eb.zip
          wait-for-deployment: true
          wait-for-environment-recovery: true
          create-application-if-not-exists: false
          create-environment-if-not-exists: false

      - name: Assert EB deployment state
        env:
          ENV_NAME: ${{ secrets.AWS_PROD_MEET_ENVIRONMENT_NAME }}
          TARGET_VERSION: meet-${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          # Ask EB what is actually running. The previous version of this step
          # compared steps.eb_deploy.outputs['version-label'] against the target —
          # but that output is the action echoing back its own input, so the test
          # could never fail. On 2026-08-05 an agent-runner deploy was rejected by
          # EB ("Failed to deploy application", invalid option values) and this step
          # still passed, leaving the environment on the previous version while CD
          # reported success.
          #
          # The action also returns as soon as it has *initiated* the update and
          # sees Ready/Green — which is the state the environment was already in
          # before the update started. So poll until the environment settles on the
          # version we asked for.
          status=""; health=""; version=""
          for i in $(seq 1 60); do
            read -r status health version < <(aws elasticbeanstalk describe-environments \
              --environment-names "${ENV_NAME}" \
              --query 'Environments[0].[Status,Health,VersionLabel]' --output text)
            echo "poll ${i}: status=${status} health=${health} version=${version}"
            if [ "${status}" = "Ready" ] && [ "${version}" = "${TARGET_VERSION}" ]; then
              break
            fi
            sleep 15
          done
          if [ "${version}" != "${TARGET_VERSION}" ]; then
            echo "::error::environment is running ${version}, expected ${TARGET_VERSION}"
            aws elasticbeanstalk describe-events --environment-name "${ENV_NAME}" \
              --max-items 15 --severity ERROR \
              --query 'Events[].[EventDate,Message]' --output text || true
            exit 1
          fi
          test "${status}" = "Ready"
          test "${health}" = "Green"

      - name: Smoke test deployed app
        env:
          ENV_URL: ${{ steps.eb_deploy.outputs['environment-url'] }}
        run: |
          set -euo pipefail

          if [ -z "${ENV_URL}" ] || [ "${ENV_URL}" = "None" ]; then
            echo "No environment URL returned by deploy action."
            exit 1
          fi

          if [[ "${HEALTH_PATH}" != /* ]]; then
            HEALTH_PATH="/${HEALTH_PATH}"
          fi

          if [[ "${ENV_URL}" == http://* || "${ENV_URL}" == https://* ]]; then
            URLS=("${ENV_URL%/}${HEALTH_PATH}")
          else
            URLS=("https://${ENV_URL%/}${HEALTH_PATH}" "http://${ENV_URL%/}${HEALTH_PATH}")
          fi

          for url in "${URLS[@]}"; do
            echo "Probing ${url}"
            if curl --fail --show-error --silent --max-time 15 \
              --retry 8 --retry-delay 5 --retry-all-errors "${url}" > /dev/null; then
              exit 0
            fi
          done

          echo "Deployed app smoke test did not return 2xx."
          exit 1

  deploy_agent_runner:
    name: Deploy Agent Runner to Elastic Beanstalk
    if: |
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: eb-production-agent-runner-deploy
      cancel-in-progress: false
    permissions:
      id-token: write
      contents: read

    env:
      AWS_REGION: us-east-1
      HEALTH_PATH: ${{ vars.AGENT_RUNNER_HEALTH_PATH || '/health' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 1

      - name: Show runner disk usage before deploy
        run: |
          set -euo pipefail
          df -h
          du -sh .

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/${{ secrets.AWS_ROLE_NAME }}
          aws-region: ${{ env.AWS_REGION }}

      # Autoscaling bounds cannot be set from .ebextensions once they exist as
      # direct environment settings — direct settings outrank the source bundle,
      # so a bundle raising MinSize while the environment still holds MaxSize=1
      # is rejected as contradictory and the whole deploy fails. That is exactly
      # what happened on 2026-08-20. Applying them here, before the deploy,
      # keeps the values in version control while satisfying EB's precedence.
      - name: Apply autoscaling bounds and instance type
        env:
          ENV_NAME: ${{ secrets.AWS_PROD_AGENT_RUNNER_ENVIRONMENT_NAME }}
          MIN_SIZE: ${{ vars.AGENT_RUNNER_MIN_SIZE || '2' }}
          MAX_SIZE: ${{ vars.AGENT_RUNNER_MAX_SIZE || '6' }}
          INSTANCE_TYPE: ${{ vars.AGENT_RUNNER_INSTANCE_TYPE || 'c6i.xlarge' }}
        run: |
          set -euo pipefail
          current_min=$(aws elasticbeanstalk describe-configuration-settings \
            --application-name "${{ secrets.AWS_APPLICATION_NAME }}" \
            --environment-name "${ENV_NAME}" \
            --query "ConfigurationSettings[0].OptionSettings[?OptionName=='MinSize'].Value | [0]" \
            --output text)
          current_max=$(aws elasticbeanstalk describe-configuration-settings \
            --application-name "${{ secrets.AWS_APPLICATION_NAME }}" \
            --environment-name "${ENV_NAME}" \
            --query "ConfigurationSettings[0].OptionSettings[?OptionName=='MaxSize'].Value | [0]" \
            --output text)
          current_type=$(aws elasticbeanstalk describe-configuration-settings \
            --application-name "${{ secrets.AWS_APPLICATION_NAME }}" \
            --environment-name "${ENV_NAME}" \
            --query "ConfigurationSettings[0].OptionSettings[?OptionName=='InstanceType'].Value | [0]" \
            --output text)
          echo "current: min=${current_min} max=${current_max} type=${current_type}"
          echo "desired: min=${MIN_SIZE} max=${MAX_SIZE} type=${INSTANCE_TYPE}"
          if [ "${current_min}" = "${MIN_SIZE}" ] \
            && [ "${current_max}" = "${MAX_SIZE}" ] \
            && [ "${current_type}" = "${INSTANCE_TYPE}" ]; then
            echo "already correct, nothing to do"
            exit 0
          fi
          # MaxSize first: raising MinSize while MaxSize is still lower is the
          # contradiction EB rejects.
          aws elasticbeanstalk update-environment \
            --application-name "${{ secrets.AWS_APPLICATION_NAME }}" \
            --environment-name "${ENV_NAME}" \
            --option-settings \
              "Namespace=aws:autoscaling:asg,OptionName=MaxSize,Value=${MAX_SIZE}" \
              "Namespace=aws:autoscaling:asg,OptionName=MinSize,Value=${MIN_SIZE}" \
              "Namespace=aws:autoscaling:launchconfiguration,OptionName=InstanceType,Value=${INSTANCE_TYPE}" \
            --query 'EnvironmentName' --output text
          echo "waiting for the environment to settle before deploying"
          for i in $(seq 1 60); do
            read -r status health < <(aws elasticbeanstalk describe-environments \
              --environment-names "${ENV_NAME}" \
              --query 'Environments[0].[Status,Health]' --output text)
            echo "poll ${i}: ${status}/${health}"
            [ "${status}" = "Ready" ] && break
            sleep 15
          done
          test "${status}" = "Ready"

      - name: Build deployment package
        run: |
          set -euo pipefail
          bash scripts/build-agent-runner-eb-deploy-package.sh deploy-agent-runner-eb.zip
          ls -lh deploy-agent-runner-eb.zip
          unzip -l deploy-agent-runner-eb.zip | sed -n '1,120p'

      - name: Deploy to Elastic Beanstalk
        id: eb_deploy
        uses: aws-actions/aws-elasticbeanstalk-deploy@v1.0.0
        with:
          aws-region: ${{ env.AWS_REGION }}
          application-name: ${{ secrets.AWS_APPLICATION_NAME }}
          environment-name: ${{ secrets.AWS_PROD_AGENT_RUNNER_ENVIRONMENT_NAME }}
          version-label: agent-runner-${{ github.event.workflow_run.head_sha }}
          deployment-package-path: deploy-agent-runner-eb.zip
          wait-for-deployment: true
          wait-for-environment-recovery: true
          create-application-if-not-exists: false
          create-environment-if-not-exists: false

      - name: Assert EB deployment state
        env:
          ENV_NAME: ${{ secrets.AWS_PROD_AGENT_RUNNER_ENVIRONMENT_NAME }}
          TARGET_VERSION: agent-runner-${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          # See the equivalent step in deploy_meet for why this queries EB directly
          # rather than trusting the deploy action's outputs.
          status=""; health=""; version=""
          for i in $(seq 1 60); do
            read -r status health version < <(aws elasticbeanstalk describe-environments \
              --environment-names "${ENV_NAME}" \
              --query 'Environments[0].[Status,Health,VersionLabel]' --output text)
            echo "poll ${i}: status=${status} health=${health} version=${version}"
            if [ "${status}" = "Ready" ] && [ "${version}" = "${TARGET_VERSION}" ]; then
              break
            fi
            sleep 15
          done
          if [ "${version}" != "${TARGET_VERSION}" ]; then
            echo "::error::environment is running ${version}, expected ${TARGET_VERSION}"
            aws elasticbeanstalk describe-events --environment-name "${ENV_NAME}" \
              --max-items 15 --severity ERROR \
              --query 'Events[].[EventDate,Message]' --output text || true
            exit 1
          fi
          test "${status}" = "Ready"
          test "${health}" = "Green"

      - name: Smoke test deployed app
        env:
          ENV_URL: ${{ steps.eb_deploy.outputs['environment-url'] }}
        run: |
          set -euo pipefail

          if [ -z "${ENV_URL}" ] || [ "${ENV_URL}" = "None" ]; then
            echo "No environment URL returned by deploy action."
            exit 1
          fi

          if [[ "${HEALTH_PATH}" != /* ]]; then
            HEALTH_PATH="/${HEALTH_PATH}"
          fi

          if [[ "${ENV_URL}" == http://* || "${ENV_URL}" == https://* ]]; then
            URLS=("${ENV_URL%/}${HEALTH_PATH}")
          else
            URLS=("https://${ENV_URL%/}${HEALTH_PATH}" "http://${ENV_URL%/}${HEALTH_PATH}")
          fi

          for url in "${URLS[@]}"; do
            echo "Probing ${url}"
            if curl --fail --show-error --silent --max-time 15 \
              --retry 8 --retry-delay 5 --retry-all-errors "${url}" > /dev/null; then
              exit 0
            fi
          done

          echo "Deployed app smoke test did not return 2xx."
          exit 1
