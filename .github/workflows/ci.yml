name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    name: Run Makefile Tests
    runs-on: ubuntu-latest
    env:
      COMPOSE_DOCKER_CLI_BUILD: "1"
      DOCKER_BUILDKIT: "1"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Prepare local test env files
        run: |
          set -euo pipefail
          cp .env.example .env
          cp services/web/.env.local.example services/web/.env.local
          {
            echo ""
            echo "OPENAI_API_KEY=ci-test-key"
            echo "DEEPGRAM_API_KEY=ci-test-key"
          } >> .env

      - name: Run tests
        run: make test

      - name: Show compose logs on failure
        if: failure()
        run: docker compose -f .devcontainer/docker-compose.yml logs --tail=300

      # The whole run's logs, not just the tail: a flaky test's evidence is usually earlier (the
      # room-delete test, 3 failures in a week, whose LiveKit and runner lines fell outside the
      # last 300). LiveKit's log records every join, leave, create and close.
      - name: Keep every service's full log on failure
        if: failure()
        run: docker compose -f .devcontainer/docker-compose.yml logs --no-color --timestamps > compose.log
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: compose-logs
          path: compose.log
          retention-days: 14

      - name: Stop compose services
        if: always()
        run: make stop
