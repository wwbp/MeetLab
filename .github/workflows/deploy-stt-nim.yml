name: Deploy STT NIM

# Provisions/updates the Parakeet NIM GPU box (infra/stt-nim) via Terraform + SSM.
# Drift-free: nothing is hand-run on the instance. See docs/gpu-stt-deployment.md.

on:
  workflow_dispatch:
    inputs:
      action:
        description: "Terraform action"
        type: choice
        options: [plan, apply]
        default: plan
  push:
    branches: [main]
    paths:
      - "infra/stt-nim/**"
      - ".github/workflows/deploy-stt-nim.yml"

permissions:
  contents: read

concurrency:
  group: stt-nim-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Terraform + NIM
    runs-on: ubuntu-latest
    environment: production
    permissions:
      id-token: write
      contents: read
    env:
      AWS_REGION: us-east-1
      # apply ONLY on an explicit workflow_dispatch(action=apply). Push to main = plan preview
      # (never a surprise apply on merge — standing up the GPU box is always deliberate).
      TF_ACTION: ${{ inputs.action == 'apply' && 'apply' || 'plan' }}

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/${{ secrets.AWS_ROLE_NAME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Seed NGC key to SSM (SecureString)
        if: env.TF_ACTION == 'apply'
        run: |
          set -euo pipefail
          aws ssm put-parameter --name "/meetlab/stt-nim/ngc_api_key" \
            --type SecureString --value "${{ secrets.NGC_API_KEY }}" --overwrite >/dev/null
          echo "NGC key written to SSM."

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.13.3"

      - name: Terraform init
        working-directory: infra/stt-nim
        run: |
          set -euo pipefail
          terraform init \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="region=${{ env.AWS_REGION }}"

      - name: Terraform ${{ env.TF_ACTION }}
        working-directory: infra/stt-nim
        run: |
          set -euo pipefail
          terraform ${{ env.TF_ACTION }} -input=false ${{ env.TF_ACTION == 'apply' && '-auto-approve' || '' }} \
            -var="region=${{ env.AWS_REGION }}" \
            -var="vpc_id=${{ vars.STT_VPC_ID }}" \
            -var="subnet_id=${{ vars.STT_SUBNET_ID }}" \
            -var="agent_runner_sg_id=${{ vars.AGENT_RUNNER_SG_ID }}" \
            -var="private_zone_id=${{ vars.PRIVATE_ZONE_ID }}"

      - name: Roll the NIM container + health check (via SSM, on the box)
        if: env.TF_ACTION == 'apply'
        working-directory: infra/stt-nim
        run: |
          set -euo pipefail
          IID="$(terraform output -raw instance_id)"
          echo "Instance: $IID"
          # Wait for the SSM agent to register (fresh boot + snap install can take a few min).
          for i in $(seq 1 60); do
            PING="$(aws ssm describe-instance-information --filters "Key=InstanceIds,Values=$IID" --query 'InstanceInformationList[0].PingStatus' --output text 2>/dev/null || true)"
            [ "$PING" = "Online" ] && { echo "SSM online"; break; }
            echo "waiting for SSM registration ($i): ${PING:-none}"; sleep 10
          done
          # Restart the unit + wait for readiness on the box (the NIM's private IP isn't
          # reachable from the runner). NVIDIA notes the NIM can take up to ~30 min on first
          # boot (image pull + model prep), so poll for up to ~35 min. Execution runs under
          # the SSM document's 1h default timeout.
          CMD_ID="$(aws ssm send-command \
            --instance-ids "$IID" \
            --document-name "AWS-RunShellScript" \
            --comment "roll+health nim-stt" \
            --timeout-seconds 600 \
            --parameters 'commands=["systemctl restart nim-stt","for i in $(seq 1 210); do curl -fsS localhost:9000/v1/health/ready && exit 0; echo waiting $i; sleep 10; done; echo NIM not ready after ~35m; systemctl status nim-stt --no-pager | tail -20; exit 1"]' \
            --query Command.CommandId --output text)"
          echo "SSM command: $CMD_ID"
          # Poll the invocation to a terminal state (up to ~40 min) — the wait waiter's
          # attempt cap is too short for a 35-min health loop.
          STATUS="Pending"
          for i in $(seq 1 80); do
            STATUS="$(aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$IID" --query Status --output text 2>/dev/null || echo Pending)"
            case "$STATUS" in Success|Failed|Cancelled|TimedOut) break;; esac
            echo "invocation status ($i): $STATUS"; sleep 30
          done
          echo "=== on-box output ==="
          aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$IID" --query StandardOutputContent --output text || true
          aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$IID" --query StandardErrorContent --output text || true
          echo "SSM status: $STATUS"
          test "$STATUS" = "Success"
