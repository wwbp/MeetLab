# The v2 staging pipeline: Terraform for infra/v2/staging, then the images.
#
#   PR into v2  -> offline tests + plan, posted on the PR (read-only role);
#                  images built but not pushed
#   merge to v2 -> build and push images tagged with the commit SHA, then apply,
#                  which points the services at that SHA and waits for them to be healthy
#                  (the `staging` environment, which only v2 may deploy to, is the
#                  only thing that can assume the apply role)
#
# One workflow, not two: chaining workflows (workflow_run) also only works from the
# default branch.
#
# The gate is the merge: GitHub's free plan has no required reviewers, so a PR into v2
# is merged only after its plan has been read and approved.
#
# infra/v2/bootstrap is deliberately absent: it defines these roles and is applied by
# a person, so CI can never widen its own permissions.
#
# No nightly drift check yet: scheduled workflows run only from the default branch
# (main, frozen). Every PR plan doubles as a drift check until v2 becomes the default.

name: Infra v2

on:
  pull_request:
    branches: [v2]
    paths: ["infra/v2/**", ".github/workflows/infra-v2.yml", "Makefile", "meet/**", "agent-runner/**"]
  push:
    branches: [v2]
    paths: ["infra/v2/**", ".github/workflows/infra-v2.yml", "meet/**", "agent-runner/**"]

permissions:
  contents: read

concurrency:
  group: infra-v2-staging
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  TF_IN_AUTOMATION: "1"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with: { terraform_version: "1.15.1" }
      - run: make test-infra

  plan:
    if: github.event_name == 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with: { terraform_version: "1.15.1", terraform_wrapper: false }
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.TF_PLAN_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Plan
        working-directory: infra/v2/staging
        run: |
          set -euo pipefail
          terraform init -input=false
          terraform plan -input=false -no-color -lock-timeout=5m -out=tfplan \
            -var="image_tag=${{ github.event.pull_request.head.sha }}"
          terraform show -no-color tfplan > plan.txt
      - name: Post plan on the PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          {
            echo "### Terraform plan — infra/v2/staging"
            echo
            grep -E '^(Plan:|No changes)' infra/v2/staging/plan.txt || true
            echo
            echo '<details><summary>Full plan</summary>'
            echo
            echo '```'
            head -c 60000 infra/v2/staging/plan.txt
            echo '```'
            echo '</details>'
          } > comment.md
          gh pr comment "${{ github.event.pull_request.number }}" --body-file comment.md

  apply:
    if: github.event_name == 'push' && github.ref == 'refs/heads/v2'
    needs: images
    runs-on: ubuntu-latest
    environment: staging
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with: { terraform_version: "1.15.1", terraform_wrapper: false }
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.TF_APPLY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Apply
        working-directory: infra/v2/staging
        run: |
          set -euo pipefail
          terraform init -input=false
          terraform plan -input=false -no-color -lock-timeout=5m -out=tfplan -var="image_tag=${{ github.sha }}"
          terraform apply -input=false -no-color tfplan
      - name: Verify no drift after apply
        working-directory: infra/v2/staging
        run: terraform plan -input=false -no-color -detailed-exitcode -var="image_tag=${{ github.sha }}"

  # PRs: prove both images still build. No credentials.
  build:
    if: github.event_name == 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { name: meet, context: meet, target: runner }
          - { name: agent-runner, context: agent-runner, target: "" }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          target: ${{ matrix.target }}
          platforms: linux/amd64
          push: false
          cache-from: type=gha,scope=${{ matrix.name }}

  # Merges: push images tagged with the commit SHA; apply then deploys that SHA.
  images:
    if: github.event_name == 'push' && github.ref == 'refs/heads/v2'
    needs: test
    runs-on: ubuntu-latest
    environment: staging
    permissions:
      contents: read
      id-token: write
    strategy:
      matrix:
        include:
          - { name: meet, context: meet, target: runner }
          - { name: agent-runner, context: agent-runner, target: "" }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.TF_APPLY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2
      - name: Skip if this SHA is already pushed
        id: exists
        run: |
          if aws ecr describe-images --repository-name "meetlab-v2/${{ matrix.name }}" \
               --image-ids imageTag=${{ github.sha }} >/dev/null 2>&1; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: docker/build-push-action@v6
        if: steps.exists.outputs.skip != 'true'
        with:
          context: ${{ matrix.context }}
          target: ${{ matrix.target }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.ecr.outputs.registry }}/meetlab-v2/${{ matrix.name }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
