# The v2 staging pipeline: Terraform for infra/v2/stack, then the images.
#
#   PR into v2  -> offline tests + plan, posted on the PR (read-only role);
#                  images built but not pushed
#   merge to v2 -> build and push images tagged with the commit SHA, then apply,
#                  which points the services at that SHA and waits for them to be healthy,
#                  then live acceptance tests against staging (acceptance_staging.py)
#                  (the `staging` environment, which only v2 may deploy to, is the
#                  only thing that can assume the apply role)
#
# One workflow, not two: chaining workflows (workflow_run) also only works from the
# default branch.
#
# The gate is the merge: GitHub's free plan has no required reviewers, so a PR into v2
# is merged only after its plan has been read and approved.
#
# infra/v2/bootstrap is deliberately absent: it defines these roles and is applied by
# a person, so CI can never widen its own permissions.
#
# No nightly drift check yet: scheduled workflows run only from the default branch
# (main, frozen). Every PR plan doubles as a drift check until v2 becomes the default.

name: Infra v2

on:
  pull_request:
    branches: [v2]
    paths: ["infra/v2/**", ".github/workflows/infra-v2.yml", "Makefile", "meet/**", "agent-runner/**", "!**/*.md"]
  push:
    branches: [v2]
    paths: ["infra/v2/**", ".github/workflows/infra-v2.yml", "meet/**", "agent-runner/**", "!**/*.md"]

permissions:
  contents: read

# A deploy has its own group: GitHub keeps one pending run per group, so sharing one
# with PR plans let a PR push silently cancel a queued deploy (2026-10-03, #138).
# A PR's newer push supersedes its own plan. A PR's plan only reads the state, so it takes no
# lock (-lock=false): its lock once failed a deploy's drift check (2026-10-04).
concurrency:
  group: ${{ github.event_name == 'push' && 'infra-v2-staging-deploy' || format('infra-v2-plan-{0}', github.ref) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  AWS_REGION: us-east-1
  TF_IN_AUTOMATION: "1"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with: { terraform_version: "1.15.1" }
      - run: make test-infra
      - run: make test-config-parity
      - uses: astral-sh/setup-uv@v6
      - run: make test-stt-cpu

  plan:
    if: github.event_name == 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with: { terraform_version: "1.15.1", terraform_wrapper: false }
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.TF_PLAN_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Plan
        working-directory: infra/v2/stack
        run: |
          set -euo pipefail
          terraform init -input=false -backend-config=key=v2/staging/terraform.tfstate
          terraform plan -input=false -no-color -lock=false -out=tfplan \
            -var="image_tag=${{ github.event.pull_request.head.sha }}"
          terraform show -no-color tfplan > plan.txt
      - name: Post plan on the PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          {
            echo "### Terraform plan — infra/v2/stack"
            echo
            grep -E '^(Plan:|No changes)' infra/v2/stack/plan.txt || true
            echo
            echo '<details><summary>Full plan</summary>'
            echo
            echo '```'
            head -c 60000 infra/v2/stack/plan.txt
            echo '```'
            echo '</details>'
          } > comment.md
          gh pr comment "${{ github.event.pull_request.number }}" --body-file comment.md

  apply:
    if: github.event_name == 'push' && github.ref == 'refs/heads/v2'
    needs: images
    runs-on: ubuntu-latest
    environment: staging
    permissions:
      contents: read
      id-token: write
    outputs:
      livekit: ${{ steps.livekit.outputs.livekit }}
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with: { terraform_version: "1.15.1", terraform_wrapper: false }
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.TF_APPLY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Apply
        working-directory: infra/v2/stack
        run: |
          set -euo pipefail
          terraform init -input=false -backend-config=key=v2/staging/terraform.tfstate
          terraform plan -input=false -no-color -lock-timeout=5m -out=tfplan -var="image_tag=${{ github.sha }}"
          terraform apply -input=false -no-color tfplan
      - name: Verify no drift after apply
        working-directory: infra/v2/stack
        run: terraform plan -input=false -no-color -lock-timeout=5m -detailed-exitcode -var="image_tag=${{ github.sha }}"
      # Which LiveKit the live tests join (parameter names, never values), and whether it records video.
      - name: LiveKit for the live tests
        id: livekit
        working-directory: infra/v2/stack
        run: echo "livekit=$(terraform output -json livekit | jq -c .)" >> "$GITHUB_OUTPUT"

  # PRs: prove both images still build. No credentials.
  build:
    if: github.event_name == 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { name: meet, context: meet, target: runner }
          - { name: agent-runner, context: agent-runner, target: "" }
          - { name: stt-cpu, context: stt-cpu, target: "" }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          target: ${{ matrix.target }}
          platforms: linux/amd64
          push: false
          cache-from: type=gha,scope=${{ matrix.name }}

  # Merges: push images tagged with the commit SHA; apply then deploys that SHA.
  images:
    if: github.event_name == 'push' && github.ref == 'refs/heads/v2'
    needs: test
    runs-on: ubuntu-latest
    environment: staging
    permissions:
      contents: read
      id-token: write
    strategy:
      matrix:
        include:
          - { name: meet, context: meet, target: runner }
          - { name: agent-runner, context: agent-runner, target: "" }
          - { name: stt-cpu, context: stt-cpu, target: "" }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.TF_APPLY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2
      - name: Skip if this SHA is already pushed
        id: exists
        run: |
          if aws ecr describe-images --repository-name "meetlab-v2/${{ matrix.name }}" \
               --image-ids imageTag=${{ github.sha }} >/dev/null 2>&1; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: docker/build-push-action@v6
        if: steps.exists.outputs.skip != 'true'
        with:
          context: ${{ matrix.context }}
          target: ${{ matrix.target }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.ecr.outputs.registry }}/meetlab-v2/${{ matrix.name }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  # Live acceptance against staging after every deploy: a bot through meet, graceful
  # stops, and a kill -9 the heartbeat must catch. Same script runs from a laptop.
  acceptance:
    if: github.event_name == 'push' && github.ref == 'refs/heads/v2'
    needs: apply
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 90 # a cold STT NIM (transcript scenario) takes up to ~45 min
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.TF_ACCEPTANCE_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Session Manager plugin (ECS Exec, for the kill -9 scenario)
        run: |
          set -euo pipefail
          curl -fsSL -o smp.deb https://s3.amazonaws.com/session-manager-downloads/plugin/latest/ubuntu_64bit/session-manager-plugin.deb
          sudo dpkg -i smp.deb
      - uses: astral-sh/setup-uv@v6
      # Seconds, before any bot starts: every AWS call the code makes, simulated
      # against the deployed roles (and calls they must never make).
      - name: Permission contract
        run: uv run --no-project --with boto3 python agent-runner/tests/permission_contract.py
      - name: Staging acceptance
        run: |
          set -euo pipefail
          get() { aws ssm get-parameter --with-decryption --name "/meetlab-v2/staging/$1" --query Parameter.Value --output text; }
          secret() { v="$(get "$2")"; echo "::add-mask::$v"; export "$1=$v"; }
          lk='${{ needs.apply.outputs.livekit }}'  # LiveKit Cloud, or our own (livekit.tf)
          secret CONSOLE_PASSWORD CONSOLE_PASSWORD
          secret LIVEKIT_API_KEY "$(jq -r .key_parameter <<<"$lk")"
          secret LIVEKIT_API_SECRET "$(jq -r .secret_parameter <<<"$lk")"
          url="$(jq -r '.url // empty' <<<"$lk")"
          if [ -n "$url" ]; then export LIVEKIT_URL="$url"; else secret LIVEKIT_URL LIVEKIT_URL; fi
          [ "$(jq -r .video <<<"$lk")" = true ] || export NO_VIDEO=1
          # Chromium for turn_relay: a participant's browser, relay-only, through our TURN.
          uvx --with playwright playwright install --with-deps chromium
          uv run --no-project --with livekit --with livekit-api --with boto3 --with playwright \
            python agent-runner/tests/acceptance_staging.py
