# Load test v2: run one standard load-test shape against staging, on one stack profile,
# from inside AWS (infra/v2/staging/loadgen.tf). How to run and read it: docs/load-testing.md
name: Load test v2

on:
  # Only a run started by hand tests anything. The push trigger exists because a
  # workflow that isn't on main (frozen) can be dispatched only once GitHub has seen
  # it run: start it with  gh workflow run loadtest-v2.yml --ref v2 -f shape=...
  push:
    branches: [v2]
    paths: [.github/workflows/loadtest-v2.yml]
  workflow_dispatch:
    inputs:
      profile:
        description: "Stack profile (agent-runner/load_profiles): ours = our models, ours-short = ours + a short-replies instruction, v1 = v1's vendors, stored = the console's config"
        type: choice
        options: [ours, ours-short, v1, stored]
        default: ours
      shape:
        description: "smoke | load | stress | spike | soak | breakpoint (agent-runner/load_plan.py)"
        type: choice
        options: [smoke, load, stress, spike, soak, breakpoint]
        default: smoke
      target:
        description: "Expected concurrent rooms (stress goes to 2x, breakpoint to 3x)"
        default: "10"
      hold_s:
        description: "Seconds per step; 0 = the shape's own (a rehearsal uses ~60)"
        default: "0"
      library:
        description: "Conversations: v1 = 100 everyday dialogues in 20 voices, rooms of 1-3 people (docs/load-testing.md); none = the 5 original scripts, 1 person"
        type: choice
        options: [v1, none]
        default: v1
      overrides:
        description: 'Bot Config fields on top of the profile, as JSON, e.g. {"user_speech_timeout_ms": 50}'
        default: "{}"
      generators:
        description: "Load generators sharing the rooms (one tops out at ~75 rooms); 2 for 100+ rooms"
        type: choice
        options: ["1", "2"]
        default: "1"
      cpu:
        description: "Load generator vCPUs x 1024 (a worker per vCPU; raise if it reports HARNESS OVERLOADED)"
        type: choice
        options: ["4096", "8192", "16384"]
        default: "4096"

concurrency:
  group: loadtest-v2  # one run at a time: two would measure each other
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  CLUSTER: meetlab-v2-staging

jobs:
  run:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 240
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.TF_ACCEPTANCE_ROLE_ARN }}
          role-duration-seconds: 14400
          aws-region: ${{ env.AWS_REGION }}
      - name: Start the load generators
        id: start
        env:
          PROFILE: ${{ inputs.profile }}
          SHAPE: ${{ inputs.shape }}
          TARGET: ${{ inputs.target }}
          HOLD_S: ${{ inputs.hold_s }}
          CPU: ${{ inputs.cpu }}
          LIBRARY_VERSION: ${{ inputs.library }}
          GENERATORS: ${{ inputs.generators }}
          OVERRIDES: ${{ inputs.overrides }}
        run: |
          set -euo pipefail
          account="$(aws sts get-caller-identity --query Account --output text)"
          bucket="meetlab-v2-staging-media-$account"
          base="loadtests/$(date -u +%Y%m%dT%H%M%SZ)-$SHAPE-$PROFILE-$TARGET"
          subnets="$(aws ec2 describe-subnets --filters 'Name=tag:Name,Values=meetlab-v2-staging-private-*' --query 'Subnets[].SubnetId' --output json)"
          sg="$(aws ec2 describe-security-groups --filters Name=group-name,Values=meetlab-v2-staging-loadgen --query 'SecurityGroups[].GroupId' --output json)"
          network="$(jq -n --argjson s "$subnets" --argjson g "$sg" '{awsvpcConfiguration: {subnets: $s, securityGroups: $g, assignPublicIp: "DISABLED"}}')"
          library="$([ "$LIBRARY_VERSION" = none ] || echo "s3://$bucket/loadtests/library/$LIBRARY_VERSION/library.json")"
          # A split run: one run id and one start time (10 min ahead: Fargate start + Prepare
          # for study) for every generator, each running every n-th room (load_plan.shard_rooms).
          run_id="$(openssl rand -hex 3)"
          t0="$([ "$GENERATORS" = 1 ] || echo $(( $(date +%s) + 600 )))"
          tasks="" results=""
          for i in $(seq 0 $((GENERATORS - 1))); do
            key="$base$([ "$GENERATORS" = 1 ] || echo "-gen$i").json"
            overrides="$(jq -n --arg cpu "$CPU" --arg mem "$((CPU * 2))" \
              --arg p "$PROFILE" --arg s "$SHAPE" --arg t "$TARGET" --arg h "$HOLD_S" \
              --arg r "s3://$bucket/$key" --arg g "$GITHUB_SHA" --arg w "$((CPU / 1024))" --arg l "$library" \
              --arg sh "$i/$GENERATORS" --arg t0 "$t0" --arg id "$run_id" --arg o "$OVERRIDES" \
              '{cpu: $cpu, memory: $mem, containerOverrides: [{name: "loadgen", environment: [
                {name: "PROFILE", value: $p}, {name: "SHAPE", value: $s}, {name: "TARGET", value: $t},
                {name: "HOLD_S", value: $h}, {name: "RESULTS", value: $r}, {name: "GIT_SHA", value: $g},
                {name: "WORKERS", value: $w}, {name: "LIBRARY", value: $l},
                {name: "SHARD", value: $sh}, {name: "T0", value: $t0}, {name: "RUN_ID", value: $id},
                {name: "OVERRIDES", value: $o}]}]}')"
            task="$(aws ecs run-task --cluster "$CLUSTER" --task-definition meetlab-v2-staging-loadgen \
              --launch-type FARGATE --started-by loadtest --network-configuration "$network" \
              --overrides "$overrides" --query 'tasks[0].taskArn' --output text)"
            echo "load generator $i/$GENERATORS: $task"
            tasks="$tasks $task" results="$results s3://$bucket/$key"
          done
          echo "tasks=${tasks# }" >> "$GITHUB_OUTPUT"
          echo "results=${results# }" >> "$GITHUB_OUTPUT"
      - name: Follow the run
        env:
          TASKS: ${{ steps.start.outputs.tasks }}
        run: |
          set -euo pipefail
          first="${TASKS%% *}"
          stream="loadgen/loadgen/${first##*/}"  # the first generator's log; the others mirror it
          since=0
          while :; do
            states="$(aws ecs describe-tasks --cluster "$CLUSTER" --tasks $TASKS --query 'tasks[].lastStatus' --output text)"
            aws logs filter-log-events --log-group-name /meetlab-v2/staging/loadgen --log-stream-names "$stream" \
              --start-time "$since" --query 'events[].[timestamp,message]' --output text 2>/dev/null \
              | while IFS=$'\t' read -r ts msg; do echo "$msg"; echo "$ts" > .since; done || true
            [ -f .since ] && since=$(( $(cat .since) + 1 ))
            [ -z "$(tr '\t' '\n' <<<"$states" | grep -v STOPPED)" ] && break
            sleep 30
          done
          codes="$(aws ecs describe-tasks --cluster "$CLUSTER" --tasks $TASKS --query 'tasks[].containers[0].exitCode' --output text)"
          echo "exit codes: $codes"
          [ -z "$(tr '\t' '\n' <<<"$codes" | grep -vx 0)" ] && echo 0 > .code || echo 1 > .code
      - name: Report
        if: always() && steps.start.outputs.results
        env:
          RESULTS: ${{ steps.start.outputs.results }}
        run: |
          set -euo pipefail
          files=""
          for r in $RESULTS; do
            f="result-$(basename "$r")"; aws s3 cp "$r" "$f" --quiet || { echo "no result at $r: see the run's log above"; exit 1; }
            files="$files $f"
          done
          # The voice scores' listener (faster-whisper) and naturalness model (UTMOS) run here,
          # never in the bot's image; CPU-only PyTorch wheels. Several files: one split run, merged.
          uv run --no-project --index https://download.pytorch.org/whl/cpu \
            --with boto3 --with faster-whisper --with soundfile --with torch --with torchaudio --with numpy \
            python agent-runner/tests/load_report.py $files | tee -a "$GITHUB_STEP_SUMMARY"
          echo "Results: \`$RESULTS\`" >> "$GITHUB_STEP_SUMMARY"
          cp ${files%% *} result.json  # merged (written back into the first)
          [ "$(cat .code 2>/dev/null)" = 0 ]
      - uses: actions/upload-artifact@v4
        if: always() && steps.start.outputs.results
        with:
          name: loadtest-result
          path: result.json
