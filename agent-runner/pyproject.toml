[project]
name = "agent-runner"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.14.0",
    "asyncpg>=0.30.0",
    "fastapi>=0.119.1",
    "itsdangerous>=2.2.0",
    "loguru>=0.7.3",
    "pipecat-ai[livekit,openai,silero,elevenlabs]>=1.12.0,<2.0.0",
    "python-dotenv>=1.2.2",
    "sqladmin>=0.27.1",
    "sqlalchemy[asyncio]>=2.0.0",
    "uvicorn>=0.38.0",
    "boto3>=1.38.0",
    "deepgram-sdk>=7.2.0",
    # imported directly (deptry): declared, not left to arrive through pipecat or sqladmin
    "aiohttp>=3.14.3",
    "livekit>=1.1.7",
    "livekit-api>=1.1.0",
    "numpy>=2.4.4",
    "pillow>=12.3.0",
    "starlette>=1.3.1",
    "wtforms>=3.1.2",
]

[tool.uv]
override-dependencies = [
    "aiohttp>=3.14.3",
    "filelock>=3.20.3",
    "msgpack>=1.2.1",
    "nltk>=3.10.3",
    "pillow>=12.3.0",
    "protobuf>=5.29.6",
    "pyjwt>=2.13.0",
    "python-multipart>=0.0.31",
    "requests>=2.33.0",
    "starlette>=1.3.1",
    "idna>=3.14",
    "urllib3>=2.7.0",
    "anyio>=4.14.2",
    "pip>=26.2.0",
    "setuptools>=83.0.0",
]

[tool.deptry]
extend_exclude = ["alembic"]

[tool.deptry.per_rule_ignores]
# Used, though no `import` names them: alembic is the image's start command (Dockerfile);
# deepgram-sdk is required by pipecat's DeepgramSTTService; itsdangerous by Starlette sessions.
DEP002 = ["alembic", "deepgram-sdk", "itsdangerous"]
