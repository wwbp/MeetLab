[project]
name = "meetlab"
version = "2.0.0"
description = "Browser meetings with a voice AI participant, recorded for research"
requires-python = ">=3.11"
# packages/core: what the API and the bot both need. Each service adds its own extra, and its
# image installs only core + that extra (services/api/Dockerfile, services/bot/Dockerfile).
dependencies = [
    "alembic>=1.14.0",
    "asyncpg>=0.30.0",
    "boto3>=1.38.0",
    "loguru>=0.7.3",
    "python-dotenv>=1.2.2",
    "sqlalchemy[asyncio]>=2.0.0",
]

[project.optional-dependencies]
# services/api: sessions, dispatch, recordings, settings, SQLAdmin. No Pipecat.
api = [
    "fastapi>=0.119.1",
    "itsdangerous>=2.2.0",
    "livekit-api>=1.1.0",
    "sqladmin>=0.27.1",
    "starlette>=1.3.1",
    "uvicorn>=0.38.0",
    "wtforms>=3.1.2",
]
# services/bot (and tools/loadtest, which runs from the bot's image): one meeting's pipeline.
bot = [
    "pipecat-ai[livekit,openai,silero,elevenlabs]>=1.14.0,<2.0.0",
    "deepgram-sdk>=7.2.0",
    # imported directly (deptry): declared, not left to arrive through pipecat
    "aiohttp>=3.14.3",
    "livekit>=1.1.7",
    "livekit-api>=1.1.0",
    "numpy>=2.4.4",
    "pillow>=13.0.0",
]

[tool.uv]
override-dependencies = [
    "aiohttp>=3.14.3",
    "filelock>=3.20.3",
    "msgpack>=1.2.1",
    "nltk>=3.10.3",
    "protobuf>=5.29.6",
    "pyjwt>=2.15.0",
    "python-multipart>=0.0.31",
    "requests>=2.33.0",
    "starlette>=1.3.1",
    "idna>=3.14",
    "urllib3>=2.8.0",
    "multidict>=6.9.1,<7",
    "mako>=1.4.2",
    "anyio>=4.14.2",
    "pip>=26.2.0",
    "setuptools>=83.0.0",
]

[tool.deptry]
extend_exclude = ["migrations"]

[tool.deptry.per_rule_ignores]
# Used, though no `import` in the services names them: alembic is the image's start command
# (services/api/Dockerfile); deepgram-sdk is required by pipecat's DeepgramSTTService;
# itsdangerous by Starlette sessions; asyncpg is SQLAlchemy's driver (postgresql+asyncpg);
# numpy is used by tools/loadtest, which runs from this image (the load generator).
DEP002 = ["alembic", "deepgram-sdk", "itsdangerous", "asyncpg", "numpy"]
